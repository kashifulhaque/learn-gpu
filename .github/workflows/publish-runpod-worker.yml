name: Publish RunPod worker

on:
  push:
    branches:
      - main
    paths:
      - content/labs/**
      - gpu/harness.py
      - gpu/lab_runner.py
      - gpu/runpod_worker/**
      - .github/workflows/publish-runpod-worker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The CUDA devel base image is large; the runner's free disk isn't enough
      # until the preinstalled toolchains this build never uses are removed.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: gpu/runpod_worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/learn-gpu-worker:latest
            ghcr.io/${{ github.repository_owner }}/learn-gpu-worker:${{ github.sha }}
