# learn-gpu — the course app and its lab runner.
#
# Caddy on this host terminates TLS and proxies to learn-gpu:8000 over the
# shared `edge` network, the same way the other services here are reached.
#
#   docker compose pull && docker compose up -d
#
# The image is built by GitHub Actions on every merge to main and pushed to
# GitHub Container Registry. It carries the PDF book and the slides PDF, built
# from the same chapters as the image, so this host builds nothing and mounts
# no book folder.

name: learn-gpu

services:
  app:
    image: ghcr.io/kashifulhaque/learn-gpu:latest
    container_name: learn-gpu
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      # Localhost only. Caddy reaches the container over `edge`, so this is not
      # a route in from outside; it exists so the app can be reached through an
      # SSH tunnel before its DNS record lands:
      #   ssh -L 8091:127.0.0.1:8091 ifkash@vm.ifkash.dev
      - "127.0.0.1:8091:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - learn-gpu-data:/data
    networks:
      - edge
    # This service only proxies lab runs to RunPod, so the container stays small.
    cpus: 0.5
    mem_limit: 384m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  learn-gpu-data:

networks:
  edge:
    external: true
